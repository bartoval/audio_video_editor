name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-server:
    name: Go Server Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ ffmpeg

      - name: Run tests and vet
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...

  test-studio:
    name: Studio Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Run tests
        working-directory: studio
        run: npm test

      - name: Check CSS token budget
        working-directory: studio
        run: npm run lint:css

      - name: Type check
        working-directory: studio
        run: npm run typecheck

      - name: Run tests with coverage
        working-directory: studio
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-server, test-studio]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build
        working-directory: studio
        run: npm run build
