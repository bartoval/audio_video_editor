name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-studio:
    name: Studio Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Run tests
        working-directory: studio
        run: npm test

      - name: Run tests with coverage
        working-directory: studio
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-studio]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build
        working-directory: studio
        run: npm run build
