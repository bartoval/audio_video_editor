x-ml-env: &ml-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  MEDIA_INPUT_PATH: /media/projects
  MEDIA_OUTPUT_PATH: /media/output
  WHISPER_MODEL: ${WHISPER_MODEL:-base}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
  DEMUCS_DEVICE: ${DEMUCS_DEVICE:-cpu}
  DEMUCS_JOBS: ${DEMUCS_JOBS:-0}

x-ml-volumes: &ml-volumes
  - ./studio-api/projects:/media/projects
  - ./studio-api/projects/.stems-output:/media/output
  - ${HOME}/.cache/huggingface:/root/.cache/huggingface
  - ${HOME}/.cache/torch:/root/.cache/torch

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-ml-worker:
    build:
      context: ./media-ml-worker
      dockerfile: ${ML_DOCKERFILE:-Dockerfile}
    runtime: ${DOCKER_RUNTIME:-runc}
    ports:
      - "8001:8000"
    environment:
      <<: *ml-env
    volumes: *ml-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  celery-worker:
    build:
      context: ./media-ml-worker
      dockerfile: ${ML_DOCKERFILE:-Dockerfile}
    runtime: ${DOCKER_RUNTIME:-runc}
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *ml-env
    volumes: *ml-volumes
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
