version: "3.8"

services:
  reverse-proxy:
    build:
      context: .
    image: ${DOCKER_USERNAME:-vabar}/studio-reverse-proxy:latest

  studio-api:
    build:
      context: ../../studio-api
    image: ${DOCKER_USERNAME:-vabar}/studio-api:latest

  studio-frontend:
    build:
      context: ../../studio
    image: ${DOCKER_USERNAME:-vabar}/studio-frontend:latest

  media-ml-worker:
    build:
      context: ../../media-ml-worker
    image: ${DOCKER_USERNAME:-vabar}/media-ml-worker:latest
