services:
  reverse-proxy:
    image: ${DOCKER_USERNAME:-vabar}/studio-reverse-proxy:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - studio-api
      - studio-frontend

  # Keep the service and image names for existing installations.
  studio-api:
    image: ${DOCKER_USERNAME:-vabar}/studio-api:latest
    environment:
      PORT: 8080
      ROOT_PATH: /app
      STEMS_DEVICE: ${STEMS_DEVICE:-cpu}
      STEMS_CACHE_DIR: /app/stems-cache
      STEMS_OFFLINE: ${STEMS_OFFLINE:-false}
      HW_ENCODER: ${HW_ENCODER:-}
    volumes:
      - studio-data:/app/projects
      - studio-tmp:/app/.tmp_chunks
      - stems-cache:/app/stems-cache
    restart: unless-stopped

  studio-frontend:
    image: ${DOCKER_USERNAME:-vabar}/studio-frontend:latest
    restart: unless-stopped

volumes:
  studio-data:
  studio-tmp:
  stems-cache:
