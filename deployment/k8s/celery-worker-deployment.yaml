apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: vabar/media-ml-worker:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - configMapRef:
                name: env-config
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672//"
            - name: MEDIA_INPUT_PATH
              value: "/media/projects"
            - name: MEDIA_OUTPUT_PATH
              value: "/media/output"
          volumeMounts:
            - name: studio-data
              mountPath: /media/projects
              readOnly: true
            - name: shared-media
              mountPath: /media/output
      volumes:
        - name: studio-data
          persistentVolumeClaim:
            claimName: studio-data-pvc
        - name: shared-media
          persistentVolumeClaim:
            claimName: shared-media-pvc
