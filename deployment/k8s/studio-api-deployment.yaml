apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  labels:
    app: studio-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: studio-api
  template:
    metadata:
      labels:
        app: studio-api
    spec:
      containers:
        - name: studio-api
          image: vabar/studio-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
          envFrom:
            - configMapRef:
                name: env-config
          volumeMounts:
            - name: studio-data
              mountPath: /app/projects
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
      volumes:
        - name: studio-data
          persistentVolumeClaim:
            claimName: studio-data-pvc
      restartPolicy: Always
