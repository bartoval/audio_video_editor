services:
  studio-api:
    image: vabar/studio-api:latest
    container_name: studio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - STORAGE_PROVIDER=local
      - MEDIA_WORKER_URL=http://media-ml-worker:8000
      - SHARED_MEDIA_PATH=/media
      - INTERNAL_API_URL=http://studio-api:8080
    volumes:
      - studio-data:/app/projects
      - shared-media:/media
    depends_on:
      media-ml-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/workspaces"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  studio-frontend:
    image: vabar/studio-frontend:latest
    container_name: studio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - studio-api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  media-ml-worker:
    image: vabar/media-ml-worker:latest
    container_name: media-ml-worker
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - MEDIA_INPUT_PATH=/media/projects
      - MEDIA_OUTPUT_PATH=/media/output
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - DEMUCS_MODEL=${DEMUCS_MODEL:-htdemucs}
      - DEMUCS_DEVICE=${DEMUCS_DEVICE:-cpu}
      - DEMUCS_JOBS=${DEMUCS_JOBS:-0}
    volumes:
      - studio-data:/media/projects:ro
      - shared-media:/media/output
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  celery-worker:
    image: vabar/media-ml-worker:latest
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - MEDIA_INPUT_PATH=/media/projects
      - MEDIA_OUTPUT_PATH=/media/output
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - DEMUCS_MODEL=${DEMUCS_MODEL:-htdemucs}
      - DEMUCS_DEVICE=${DEMUCS_DEVICE:-cpu}
      - DEMUCS_JOBS=${DEMUCS_JOBS:-0}
    volumes:
      - studio-data:/media/projects:ro
      - shared-media:/media/output
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/99-consumer-timeout.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 studio-api studio-frontend media-ml-worker

volumes:
  studio-data:
    driver: local
  shared-media:
    driver: local
  rabbitmq-data:
    driver: local
