services:
  studio-api:
    image: vabar/studio-api:latest
    container_name: studio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ROOT_PATH: /app
      STEMS_DEVICE: ${STEMS_DEVICE:-cpu}
      STEMS_CACHE_DIR: /app/stems-cache
      STEMS_OFFLINE: ${STEMS_OFFLINE:-false}
      HW_ENCODER: ${HW_ENCODER:-}
    volumes:
      - studio-data:/app/projects
      - studio-tmp:/app/.tmp_chunks
      - stems-cache:/app/stems-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  studio-frontend:
    image: vabar/studio-frontend:latest
    container_name: studio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - studio-api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 studio-api studio-frontend

volumes:
  studio-data:
    driver: local
  studio-tmp:
    driver: local
  stems-cache:
    driver: local
