services:
  studio-api:
    image: vabar/studio-api:latest
    container_name: studio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - STORAGE_PROVIDER=local
      - AI_MUSIC_API_KEY=${AI_MUSIC_API_KEY:-}
      - AI_MUSIC_ACCOUNT=${AI_MUSIC_ACCOUNT:-}
      - MEDIA_WORKER_URL=http://media-ml-worker:8000
      - SHARED_MEDIA_PATH=/media
      - INTERNAL_API_URL=http://studio-api:8080
      # - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080/auth}
      # - KEYCLOAK_REALM=${KEYCLOAK_REALM:-studio}
      # - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-studio-api}
    volumes:
      - studio-data:/app/projects
      - shared-media:/media
    depends_on:
      media-ml-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/workspaces"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  studio-frontend:
    image: vabar/studio-frontend:latest
    container_name: studio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - studio-api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro

